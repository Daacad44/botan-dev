<div class="section-header reveal">
    <div class="section-tag">◈ CONTACT</div>
    <h2 class="section-title">Let's Connect</h2>
    <div class="glow-line"></div>
    <p class="section-desc">Have a project in mind? Let's build something extraordinary together.</p>
</div>
<div class="contact-grid">
    <div class="contact-form reveal">
        <div class="form-group">
            <input type="text" id="nameInput" required>
            <label for="nameInput">Your Name</label>
        </div>
        <div class="form-group">
            <input type="email" id="emailInput" required>
            <label for="emailInput">Your Email</label>
        </div>
        <div class="form-group">
            <input type="text" id="subjectInput" required>
            <label for="subjectInput">Subject</label>
        </div>
        <div class="form-group">
            <textarea id="messageInput" required></textarea>
            <label for="messageInput">Message</label>
        </div>
        <button class="submit-btn" onclick="submitContactForm(event)">TRANSMIT MESSAGE ⚡</button>
    </div>
    <div class="contact-info reveal">
        <div class="contact-item">
            <div class="contact-item-icon">📧</div>
            <div class="contact-item-text">
                <div class="ci-label">Email</div>
                <div class="ci-value">hello@botandev.com</div>
            </div>
        </div>
        <div class="contact-item">
            <div class="contact-item-icon">📍</div>
            <div class="contact-item-text">
                <div class="ci-label">Location</div>
                <div class="ci-value">San Francisco, CA</div>
            </div>
        </div>
        <div class="contact-item">
            <div class="contact-item-icon">🌐</div>
            <div class="contact-item-text">
                <div class="ci-label">Website</div>
                <div class="ci-value">botandev.com</div>
            </div>
        </div>
        <div class="contact-item">
            <div class="contact-item-icon">💬</div>
            <div class="contact-item-text">
                <div class="ci-label">Discord</div>
                <div class="ci-value">BotanDev#0001</div>
            </div>
        </div>
    </div>
</div>
